<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title description">
  <title id="title">Connecting physics, simulation, and learning</title>
  <desc id="description">A navy engineering banner with teal trajectories and a wireframe surface. Building intelligent systems for the physical world.</desc>
  <defs>
